<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kim's Writing Archive ‎ . ݁⋆ ۶ৎ ݁˖ . ݁</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fdf6f0;
      color: #1a1a1a;
      max-width: 680px;
      margin: 60px auto;
      padding: 0 24px;
      line-height: 1.6;
    }
    header {
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 20px;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-block;
      background-color: #f6d55c;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px 0;
    }
    p.subtitle {
      margin: 0;
      color: #555;
      font-size: 15px;
    }
    .section-heading {
      font-family: "Helvetica World", "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #f6d55c 0%, #fbd3e9 100%);
      border: 1.5px solid #1a1a1a;
      border-radius: 10px;
      padding: 10px 18px;
      margin: 32px 0 16px 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 3px 3px 0px #1a1a1a;
    }
    .section-heading:first-of-type {
      margin-top: 0;
    }
    .article-card {
      display: block;
      background: #ffffff;
      border: 1.5px solid #1a1a1a;
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 16px;
      text-decoration: none;
      color: #1a1a1a;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 4px 4px 0px #1a1a1a;
    }
    .article-title {
      font-weight: 700;
      font-size: 17px;
      display: block;
      margin-bottom: 4px;
    }
    .article-meta {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <span class="badge">Welcome!</span>
    <h1>Kim's Writing Archive ‎ . ݁⋆ ۶ৎ ݁˖ . ݁</h1>
    <p class="subtitle">Selected published stories by Kimberly Anne Ojeda</p>
  </header>

  <main>
    <h2 class="section-heading">Long-form articles</h2>

    <a class="article-card" href="bears-of-joy.html">
      <span class="article-title">'Bears of Joy' bring smiles, warmth ↗</span>
      <span class="article-meta">Daily Tribune • Feature / Community</span>
    </a>

    <!-- Copy and paste the block below when you want to start a new category:

      <span class="article-title">Article Headline Here ↗</span>
      <span class="article-meta">Daily Tribune • News</span>
    </a>
    -->
  </main>
</body>
</html>
